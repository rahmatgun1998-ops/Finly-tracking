<style>
:root{--bg1:#b9a4f7;--bg2:#f6c6d8;--g:rgba(255,255,255,.55);--g2:rgba(255,255,255,.4);--bd:rgba(255,255,255,.8);--tx:#1f1b33;--mut:#7d7898;--pr:#8b6cf0;--out:#f5b81c;--neg:#e5484d;--pos:#2a9d66;--sh:0 10px 34px rgba(90,60,180,.16);--inp:rgba(255,255,255,.7);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1533;--bg2:#3a2250;--g:rgba(46,40,70,.55);--g2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.12);--tx:#f2eefc;--mut:#a39eba;--sh:0 10px 34px rgba(0,0,0,.35);--inp:rgba(255,255,255,.08);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1b1533;--bg2:#3a2250;--g:rgba(46,40,70,.55);--g2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.12);--tx:#f2eefc;--mut:#a39eba;--sh:0 10px 34px rgba(0,0,0,.35);--inp:rgba(255,255,255,.08);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Poppins,system-ui,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:fl 16s ease-in-out infinite alternate}
.b1{width:380px;height:380px;background:#8b6cf0;top:-90px;right:-60px}.b2{width:320px;height:320px;background:#f58fb8;bottom:-80px;left:10%;animation-delay:-6s}.b3{width:240px;height:240px;background:#f5b81c;top:45%;left:40%;opacity:.25;animation-delay:-3s}
@keyframes fl{to{transform:translate(-50px,60px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes fi{from{opacity:0}}
@keyframes dn{from{stroke-dasharray:0 100}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.app{position:relative;z-index:1;max-width:1300px;margin:auto;display:flex;flex-direction:column;gap:18px;padding:20px}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh)}
.tb{padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:12px;z-index:5;border-radius:20px}.nav{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}.tr{display:flex;gap:8px;flex:none;margin-left:auto}.ic{display:none}@media(max-width:1180px){.lbl{display:none}.ic{display:inline}.nv{padding:10px 12px}}
.logo{font-size:22px;font-weight:600;padding:0 8px 0 4px;display:flex;gap:10px;align-items:center}
.logo svg{width:36px;height:36px;animation:pop .8s both}
button{font:inherit;color:inherit;cursor:pointer}
.nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;border:0;background:none;transition:.25s;text-align:left}
.nv:hover{background:var(--g2);transform:translateX(4px)}
.nv.on{background:var(--pr);color:#fff;box-shadow:0 8px 20px rgba(139,108,240,.45)}
.nv:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.sp{flex:1}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:500;flex:1;min-width:200px}
h2{font-size:15px;font-weight:500}
.btn{border:1px solid var(--bd);background:var(--g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px 16px;border-radius:14px;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn.pr{background:var(--pr);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c{padding:20px;animation:up .6s both;animation-delay:calc(var(--i,0)*80ms)}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.lb{color:var(--mut);font-size:13px}
.big{font-size:28px;font-weight:600;margin:4px 0}
.p{color:var(--pos)}.n{color:var(--neg)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;animation:dr 1.6s ease-out both}
.ar{animation:fi 1.6s .5s both}
.dot{transition:.2s;cursor:pointer}.dot:hover{r:7}
.r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--g2);animation:up .5s both;animation-delay:calc(var(--k,0)*50ms)}

 const H={pick:['Pilih akun','Pilih akun untuk membuka datamu'],reg:['Daftar akun baru',''],login:['Halo, '+(A?A.name:''),'Masukkan passcode 6 digit']}[mode];

 $('.av').textContent=mode=='login'&&A?A.av:'🔐';

 $('#lm').textContent=msg||'';
 $('#ac').innerHTML=ACC.map(a=>`<button class="ab" data-id="${a.id}"><i>${a.av}</i><span>${esc(a.name)}<small>@${esc(a.un||a.name.toLowerCase())}</small></span></button>`).join('')+'<button class="ab nw" data-id="new"><i>＋</i><span>Daftar akun baru</span></button>';

function toReg(){pend={av:AVS[0]};['#rn','#ru','#re','#rp','#rq'].forEach(s=>$(s).value='');pin='';mode='reg';ui()}
function setMode(){A=null;pend=null;pin='';first='';if(ACC.length){mode='pick';ui()}else toReg()}
function bad(m){const c=$(mode=='reg'?'.rg':'#dt');c.classList.remove('sk');void c.offsetWidth;c.classList.add('sk');pin='';ui(m)}
async function submit(){
 let ok=false;
 try{const k=await mk(pin,ub(A.s)),o=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(A.i)},k,ub(A.d))));SALT=ub(A.s);K=k;T=Array.isArray(o)?o:(o.T||[]);P=o.P||{};G=o.G||seedG();ok=true}catch(e){}
 ok?enter():bad('Passcode salah')}
async function register(){
 const g=s=>$(s).value.trim(),n=g('#rn'),u=g('#ru').toLowerCase(),m=g('#re'),p=$('#rp').value,q=$('#rq').value;
 if(n.length<2)return bad('Nama lengkap minimal 2 karakter');
 if(!/^[a-z0-9_]{3,16}$/.test(u))return bad('Username 3–16 karakter: huruf kecil, angka, atau _');
 if(ACC.some(a=>(a.un||a.name).toLowerCase()==u))return bad('Username sudah dipakai');
 if(m&&!/^\S+@\S+\.\S+$/.test(m))return bad('Format email tidak valid');
 if(!/^\d{6}$/.test(p))return bad('Passcode harus 6 digit angka');
 if(p!=q)return bad('Konfirmasi passcode tidak sama');
 A={id:Date.now(),name:n,un:u,av:pend.av};T=ACC.length?[]:seedT();G=ACC.length?[]:seedG();P=m?{email:m}:{};
 await rekey(p);ACC.push(A);persist();enter()}

const seedT=()=>S.map((s,i)=>({id:i,type:s[0],title:s[1],cat:s[2],amt:s[3],date:iso(s[4])}));
const seedG=()=>[{id:1,icon:'🏝️',name:'Liburan ke Bali',target:5000000,saved:3000000,due:''},{id:2,icon:'💻',name:'Laptop baru',target:14000000,saved:6000000,due:''},{id:3,icon:'🛟',name:'Dana darurat',target:20000000,saved:5000000,due:''}];
const save=()=>{if(K)seal()};
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const sum=a=>a.reduce((x,t)=>x+t.amt,0);

const row=(t,del,k)=>`<div class="r" style="--k:${k}"><i style="background:${C[t.cat]||'#999'}">${t.cat[0]}</i><div><b>${esc(t.title)}</b><small>${fd(t.date)} · ${t.cat}</small></div><span class="${t.type=='in'?'p':'n'}">${t.type=='in'?'+':'-'}${rp(t.amt)}</span>${del?`<button class="x" data-ed="${t.id}" aria-label="Ubah">✎</button><button class="x" data-del="${t.id}" aria-label="Hapus">×</button>`:''}</div>`;
const num=(n,cls='')=>`<div class="big ${cls}" data-n="${n}">${rp(0)}</div>`;

function sm(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d}
function chart(){
  const W=8,I=Array(W).fill(0),O=Array(W).fill(0),t0=new Date(iso(0)+'T00:00').getTime();
  T.forEach(t=>{const k=Math.floor((t0-new Date(t.date+'T00:00').getTime())/864e5),w=Math.floor(k/7);if(k>=0&&w<W)(t.type=='in'?I:O)[W-1-w]+=t.amt});
  const mx=Math.max(1,...I,...O)*1.1,X=i=>50+i*(530/(W-1)),Y=v=>190-v/mx*170;
  const pi=I.map((v,i)=>[X(i),Y(v)]),po=O.map((v,i)=>[X(i),Y(v)]);
  let g='';for(let i=0;i<=4;i++){const y=20+i*42.5;g+=`<line x1="50" x2="590" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="42" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">${(mx*(1-i/4)/1e6).toFixed(1)}jt</text>`}
  let lb='';for(let i=0;i<W;i++){const d=new Date(t0-(W-1-i)*7*864e5);lb+=`<text x="${X(i)}" y="212" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55">${d.getDate()} ${d.toLocaleDateString('id-ID',{month:'short'})}</text>`}
  const dots=(p,v,c,n)=>p.map((q,i)=>`<circle class="dot" cx="${q[0]}" cy="${q[1]}" r="4.5" fill="${c}" stroke="#fff" stroke-width="2"><title>${n}: ${rp(v[i])}</title></circle>`).join('');
  return `<svg viewBox="0 0 600 220" role="img" aria-label="Grafik pemasukan dan pengeluaran mingguan">${g}${lb}
  <path class="ar" d="${sm(pi)}L${X(W-1)},190L50,190Z" fill="#8b6cf0" opacity=".14"/>
  <path class="ln" pathLength="1" d="${sm(pi)}" stroke="#8b6cf0"/><path class="ln" pathLength="1" style="animation-delay:.3s" d="${sm(po)}" stroke="#f5b81c"/>
  ${dots(pi,I,'#8b6cf0','Pemasukan')}${dots(po,O,'#f5b81c','Pengeluaran')}</svg>`}
const goalRow=(g,i)=>{const p=g.target?Math.min(100,Math.round(g.saved/g.target*100)):0,d=g.due?' · target '+fd(g.due):'';
  return `<div class="gr" style="--k:${i}"><div class="gh"><i>${g.icon}</i><div><b>${esc(g.name)}</b><small>${p>=100?'🎉 Tercapai':'Kurang '+rp(Math.max(0,g.target-g.saved))}${d}</small></div><span class="gp">${p}%</span></div><div class="bar"><u data-w="${p}"></u></div><div class="gf"><span class="lb">${rp(g.saved)} / ${rp(g.target)}</span><span><button class="btn gb" data-gdep="${g.id}">+ Setor</button><button class="x" data-ged="${g.id}" aria-label="Ubah">✎</button><button class="x" data-gdel="${g.id}" aria-label="Hapus">×</button></span></div></div>`};
const goalsMini=()=>G.length?G.slice(0,3).map(g=>{const p=g.target?Math.min(100,Math.round(g.saved/g.target*100)):0;return `<div class="gl"><div><span>${g.icon} ${esc(g.name)}</span><b>${p}%</b></div><div class="bar"><u data-w="${p}"></u></div></div>`}).join(''):'<div class="em">Belum ada target tabungan.</div>';
function chart1(type){
  const W=8,B=Array(W).fill(0),t0=new Date(iso(0)+'T00:00').getTime(),col=type=='in'?'#8b6cf0':'#f5b81c';
  T.forEach(t=>{if(t.type!=type)return;const k=Math.floor((t0-new Date(t.date+'T00:00').getTime())/864e5),w=Math.floor(k/7);if(k>=0&&w<W)B[W-1-w]+=t.amt});
  const mx=Math.max(1,...B)*1.1,X=i=>40+i*(310/(W-1)),Y=v=>160-v/mx*135,p=B.map((v,i)=>[X(i),Y(v)]);
  let g='',lb='';for(let i=0;i<=3;i++){const y=25+i*45;g+=`<line x1="40" x2="350" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="34" y="${y+3}" text-anchor="end" font-size="9" fill="currentColor" opacity=".55">${(mx*(1-i/3)/1e6).toFixed(1)}jt</text>`}
  for(let i=1;i<W;i+=2){const d=new Date(t0-(W-1-i)*7*864e5);lb+=`<text x="${X(i)}" y="182" text-anchor="middle" font-size="9" fill="currentColor" opacity=".55">${d.getDate()} ${d.toLocaleDateString('id-ID',{month:'short'})}</text>`}
  return `<svg viewBox="0 0 360 190" role="img" aria-label="Tren mingguan">${g}${lb}<path class="ar" d="${sm(p)}L350,160L40,160Z" fill="${col}" opacity=".15"/><path class="ln" pathLength="1" d="${sm(p)}" stroke="${col}"/>${p.map((q,i)=>`<circle class="dot" cx="${q[0]}" cy="${q[1]}" r="4" fill="${col}" stroke="#fff" stroke-width="2"><title>${rp(B[i])}</title></circle>`).join('')}</svg>`}
function donut(list){
  const tot=sum(list);if(!tot)return '<div class="em">Belum ada pengeluaran</div>';
  const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);let acc=0,s='',l='';
  e.forEach(([k,v],i)=>{const p=v/tot*100;s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${C[k]}" stroke-width="5" stroke-dasharray="${Math.max(p-1,.1)} ${101-p}" stroke-dashoffset="${25-acc}" style="animation-delay:${i*.12}s"><title>${k}: ${rp(v)}</title></circle>`;acc+=p;l+=`<div><i style="background:${C[k]}"></i>${k}<span>${Math.round(p)}% · ${rp(v)}</span></div>`});
  return `<div class="dw"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="currentColor" opacity=".08" stroke-width="5"/>${s}<text x="21" y="20.5" text-anchor="middle" font-size="3.4" font-weight="600" fill="currentColor">${rp(tot).replace('Rp ','')}</text><text x="21" y="25" text-anchor="middle" font-size="2.4" fill="currentColor" opacity=".6">total keluar</text></svg><div class="lst">${l}</div></div>`}
function bars(list){
  const tot=sum(list)||1,m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  return e.length?e.map(([k,v])=>`<div class="bw"><div><span>${k}</span><span class="lb">${rp(v)} · ${Math.round(v/tot*100)}%</span></div><div class="bar"><u data-w="${v/tot*100}"></u></div></div>`).join(''):'<div class="em">Belum ada data</div>'}

list(type){

  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%')));

function go(){if(!A)return;const h=location.hash.slice(1);view=V[h]&&h!='list'?h:'dashboard';render()}
addEventListener('hashchange',go);
document.querySelectorAll('.nv[data-v]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});

let mt='in';
let eid=null;function openM(type,t){eid=t?t.id:null;
  mt=type;$('#mt').textContent=(t?'Ubah ':'Tambah ')+(type=='in'?'pemasukan':'pengeluaran');
  $('#f3').innerHTML=Object.keys(type=='in'?CI:CO).map(k=>`<option>${k}</option>`).join('');
  $('#f1').value=t?t.title:'';$('#f2').value=t?t.amt:'';$('#f3').value=t?t.cat:Object.keys(type=='in'?CI:CO)[0];$('#f4').value=t?t.date:iso(0);$('#ov').classList.add('on');$('#f1').focus();
}
const closeM=()=>$('#ov').classList.remove('on');
$('#ai').onclick=()=>openM('in');$('#ao').onclick=()=>openM('out');$('#cn').onclick=closeM;
$('#ov').onclick=e=>{if(e.target.id=='ov')closeM()};
addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
$('#sv').onclick=()=>{
  const title=$('#f1').value.trim(),amt=+$('#f2').value,date=$('#f4').value;
  if(!title||!(amt>0)||!date){$('#f1').style.borderColor=title?'':'var(--neg)';$('#f2').style.borderColor=amt>0?'':'var(--neg)';return}
  const o={type:mt,title,cat:$('#f3').value,amt,date};if(eid!==null){const t=T.find(x=>x.id==eid);if(t)Object.assign(t,o)}else T.push({id:Date.now(),...o});save();closeM();
  $('#f1').style.borderColor=$('#f2').style.borderColor='';render();
};
$('#v').onclick=e=>{
  const d=e.target.closest('[data-del]'),a=e.target.closest('[data-add]');
  if(d){if(d.dataset.arm){T=T.filter(t=>t.id!=d.dataset.del);save();render()}else{d.dataset.arm=1;d.textContent='Hapus?';d.style.cssText='color:var(--neg);font-size:12px';setTimeout(()=>{if(d.isConnected){delete d.dataset.arm;d.textContent='×';d.style.cssText=''}},2500)}}
  const ed=e.target.closest('[data-ed]');if(ed){const t=T.find(x=>x.id==ed.dataset.ed);if(t)openM(t.type,t)}
  if(a)openM(a.dataset.add);
  if(e.target.closest('[data-gadd]'))openG();
  const ge=e.target.closest('[data-ged]');if(ge)openG(G.find(x=>x.id==ge.dataset.ged));
  const gd=e.target.closest('[data-gdep]');if(gd)openD(G.find(x=>x.id==gd.dataset.gdep));
  const gx=e.target.closest('[data-gdel]');
  if(gx){if(gx.dataset.arm){G=G.filter(t=>t.id!=gx.dataset.gdel);save();render()}else{gx.dataset.arm=1;gx.textContent='Hapus?';gx.style.cssText='color:var(--neg);font-size:12px';setTimeout(()=>{if(gx.isConnected){delete gx.dataset.arm;gx.textContent='×';gx.style.cssText=''}},2500)}}
  const av=e.target.closest('[data-a]');if(av)document.querySelectorAll('#pa button').forEach(x=>x.classList.toggle('on',x==av));
  const b=e.target.closest('button[id]');if(!b)return;
  if(b.id=='sw')lock();
  if(b.id=='ps'){A.name=$('#pn').value.trim()||A.name;A.av=document.querySelector('#pa .on')?.dataset.a||A.av;P.email=$('#pe').value.trim();save();render()}
  if(b.id=='pc'){const v=$('#pp').value;if(!/^\d{6}$/.test(v)){$('#pm').style.color='var(--neg)';$('#pm').textContent='Passcode harus 6 digit angka';return}rekey(v).then(()=>{$('#pp').value='';$('#pm').style.color='var(--pos)';$('#pm').textContent='Passcode berhasil diubah ✓'})}
  if(b.id=='pdel'){if(b.dataset.arm){ACC=ACC.filter(x=>x!=A);persist();lock()}else{b.dataset.arm=1;b.textContent='Tekan lagi untuk menghapus akun';setTimeout(()=>{b.dataset.arm='';b.textContent='Hapus akun ini'},3500)}}
};
$('#th').onclick=()=>{
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.dataset.theme=cur=='dark'?'light':'dark';
};
const GI=['🎯','🏝️','💻','🏠','🚗','📱','🎓','💍','🛟','🎁'];let gid=null,dg=null;
$('#gi').innerHTML=GI.map(i=>`<option>${i}</option>`).join('');
function openG(g){gid=g?g.id:null;$('#gt0').textContent=g?'Ubah target tabungan':'Target tabungan baru';$('#gn').value=g?g.name:'';$('#gi').value=g?g.icon:GI[0];$('#gtg').value=g?g.target:'';$('#gs').value=g?g.saved:'';$('#gd').value=g?g.due:'';$('#gv').classList.add('on');$('#gn').focus()}
$('#gsv').onclick=()=>{const name=$('#gn').value.trim(),target=+$('#gtg').value,saved=+$('#gs').value||0;
 if(!name||!(target>0)){$('#gn').style.borderColor=name?'':'var(--neg)';$('#gtg').style.borderColor=target>0?'':'var(--neg)';return}
 const o={name,icon:$('#gi').value,target,saved:Math.max(0,saved),due:$('#gd').value};
 if(gid!==null){const g=G.find(x=>x.id==gid);if(g)Object.assign(g,o)}else G.push({id:Date.now(),...o});
 save();$('#gv').classList.remove('on');$('#gn').style.borderColor=$('#gtg').style.borderColor='';render()};
$('#gc').onclick=()=>$('#gv').classList.remove('on');
function openD(g){if(!g)return;dg=g;$('#dt2').textContent=g.icon+' '+g.name;$('#dh').textContent='Terkumpul '+rp(g.saved)+' dari '+rp(g.target);$('#dp').value='';$('#dv').classList.add('on');$('#dp').focus()}
const dep=s=>{const v=+$('#dp').value;if(!(v>0)){$('#dp').style.borderColor='var(--neg)';return}$('#dp').style.borderColor='';dg.saved=Math.max(0,dg.saved+s*v);save();$('#dv').classList.remove('on');render()};
$('#dpi').onclick=()=>dep(1);$('#dpo').onclick=()=>dep(-1);$('#dpc').onclick=()=>$('#dv').classList.remove('on');
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target==o)o.classList.remove('on')}));
addEventListener('keydown',e=>{if(e.key=='Escape')document.querySelectorAll('.ov.on').forEach(o=>o.classList.remove('on'))});
